name: Build and Release Patches

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Patches Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean buildAndroid

      - name: Upload Patch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: awt-patches-mpp
          path: patches/build/libs/*.mpp

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: Awt Patches v4.0.0
          body: "Awt Instagram Patches with modern AMOLED Aurora glow UI and fix for Instagram 447.0.0.55.81"
          files: patches/build/libs/*.mpp
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
